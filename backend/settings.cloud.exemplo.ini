# Configurações da aplicação — MODO NUVEM (Supabase)
# Copie este arquivo para settings.ini e preencha com os valores do seu projeto Supabase.
# Rode o projeto com: ./mvnw spring-boot:run -Dspring.profiles.active=cloud
# NUNCA commite o settings.ini no git.

# --SQL--
# Connection string do Supabase: Settings > Database > Connection string > JDBC
sql.url=jdbc:postgresql://db.SEU_PROJECT_ID.supabase.co:5432/postgres?sslmode=require
sql.user=postgres
sql.password=SUA_SENHA_DO_PROJETO_SUPABASE

# --Supabase--
# Settings > API > Project URL
supabase.projectUrl=https://SEU_PROJECT_ID.supabase.co
# Settings > API > API Keys > service_role
supabase.serviceRoleKey=SEU_SERVICE_ROLE_KEY

# --Storage--
storage.bucketName=templates
