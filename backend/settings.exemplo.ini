# Arquivo de configurações da aplicação — EXEMPLO
# Copie este arquivo para settings.ini e preencha com os valores reais.
# NUNCA commite o settings.ini no git.

# --Supabase--
supabase.projectUrl=https://SEU_PROJECT_ID.supabase.co
supabase.serviceRoleKey=SEU_SERVICE_ROLE_KEY

# --SQL--
# Connection string do Supabase: Settings > Database > Direct connection
sql.url=jdbc:postgresql://db.SEU_PROJECT_ID.supabase.co:5432/postgres?sslmode=require
sql.user=postgres
sql.password=SUA_SENHA_DO_PROJETO_SUPABASE

# --Storage--
# Nome do bucket criado no Supabase Storage
storage.bucketName=templates

# --Hash--
# Configurações de hash de senha (não alterar)
hash.iterationCount=65536
hash.keySize=128
hash.saltLength=16
