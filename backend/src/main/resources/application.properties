spring.application.name=mailscheduler

# Datasource — valores lidos do settings.ini via @PropertySource
spring.datasource.url=${sql.url}
spring.datasource.username=${sql.user}
spring.datasource.password=${sql.password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway — migrations automáticas do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${sql.url}
spring.flyway.user=${sql.user}
spring.flyway.password=${sql.password}

# Supabase
supabase.project-url=${supabase.projectUrl}
supabase.service-role-key=${supabase.serviceRoleKey}
supabase.storage.bucket=${storage.bucketName}
